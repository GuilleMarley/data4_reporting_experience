<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data4 · Presenter</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="realtime.js"></script>
</head>
<body>
<div class="topbar"><div class="inner"><div class="logo">Serveo <span>Data4</span></div><div id="phaseLabel" class="phase">LOBBY</div></div></div>
<main class="stage">
  <div class="hero">
    <div><div class="eyebrow">DATA4 REPORTING EXPERIENCE</div><h1 id="title">La audiencia se está conectando</h1><p id="copy" class="lead">Comparte la URL de audience.html. Después iniciaremos una simulación del proceso AS IS.</p></div>
    <div class="card"><b>Código de sesión</b><div style="font-size:32px;color:var(--orange);font-weight:800;margin-top:6px">D4DEMO</div><small id="liveStatus">Conectando realtime…</small></div>
  </div>
  <div id="content"></div>
</main>
<div class="toolbar">
<button onclick="changePhase('lobby')">Lobby</button>
<button onclick="changePhase('asis')">AS IS</button>
<button class="primary" onclick="changePhase('improve')">Improve</button>
<button onclick="changePhase('control')">Control</button>
<button onclick="changePhase('results')">Resultados</button>
<button onclick="refreshStats()">Actualizar datos</button>
</div>
<script>
const states={
lobby:{label:'LOBBY',title:'La audiencia se está conectando',copy:'Cada asistente elige un rol y espera a que arranque la dinámica.'},
asis:{label:'AS IS',title:'Vivir el problema antes de automatizarlo',copy:'Cada rol recibe una tarea manual diferente: identificar datos, registrar lecturas, gestionar incidencias o priorizar riesgos.'},
improve:{label:'IMPROVE',title:'Ahora repetimos el proceso con las herramientas',copy:'La captura se estructura, los mappings se automatizan y las herramientas generan el Operation Book señalando las excepciones que requieren revisión.'},
control:{label:'CONTROL',title:'¿La mejora funciona para quienes la utilizan?',copy:'Cada perfil evalúa facilidad de uso, reducción de trabajo repetitivo y confianza en el proceso.'},
results:{label:'RESULTADOS',title:'De trabajo manual a gestión por excepción',copy:'DC03 pasa de aproximadamente 20 horas de dedicación a 30 minutos de ejecución.'}
};
function baseCards(){
 return '<div class="kpis"><div class="kpi"><strong>88,6 h</strong><small>baseline mensual</small></div><div class="kpi"><strong>43 h</strong><small>Operation Book</small></div><div class="kpi"><strong>27,4 h</strong><small>extracción</small></div><div class="kpi"><strong>79,5%</strong><small>concentrado en dos bloques</small></div></div>';
}
function draw(p){const s=states[p]||states.lobby;phaseLabel.textContent=s.label;title.textContent=s.title;copy.textContent=s.copy;
if(p==='results')content.innerHTML='<div class="resultgrid"><div class="metric"><strong>20 h</strong>Antes · DC03</div><div class="metric"><strong>30 min</strong>Ahora · DC03</div><div class="metric"><strong>97,5%</strong>Mejora real</div><div class="metric"><strong>1 día</strong>Plazo actual</div></div><div id="liveStats" class="card" style="margin-top:18px">Cargando participación…</div><div class="card success" style="margin-top:18px"><b>La herramienta controla errores y avisa qué elementos deben revisarse antes de entregar.</b></div>';
else if(p==='improve')content.innerHTML='<div class="kpis"><div class="kpi"><strong>DC03</strong><small>entregado · control</small></div><div class="kpi"><strong>DC02</strong><small>desarrollado · validación</small></div><div class="kpi"><strong>DC01</strong><small>en desarrollo</small></div><div class="kpi"><strong>App Contadores</strong><small>entregada</small></div></div>';
else content.innerHTML=baseCards();
if(p==='results') refreshStats();
}
async function changePhase(p){
 let pin=sessionStorage.getItem('data4_presenter_pin');
 if(!pin){pin=prompt('PIN del presentador');if(!pin)return;sessionStorage.setItem('data4_presenter_pin',pin);}
 try{
   const ok=await Data4Realtime.setPhase(p,pin);
   if(!ok){sessionStorage.removeItem('data4_presenter_pin');alert('PIN incorrecto.');return;}
   draw(p);
 }catch(e){console.error(e);alert('No se pudo cambiar la fase. Revisa la conexión con Supabase.');}
}
async function refreshStats(){
 const box=document.getElementById('liveStats'); if(!box)return;
 try{
  const s=await Data4Realtime.stats();
  if(!s){box.textContent='Modo demo local.';return;}
  const counts={gestor:0,area:0,graduate:0,tecnico:0};
  s.participants.forEach(x=>counts[x.role]=(counts[x.role]||0)+1);
  const control=s.responses.filter(x=>x.phase==='control').map(x=>Number(x.answer)).filter(Number.isFinite);
  const avg=control.length?(control.reduce((a,b)=>a+b,0)/control.length).toFixed(1):'—';
  box.innerHTML='<b>Participación en directo</b><div style="margin-top:10px">Total: <b>'+s.participants.length+'</b> · Gestor: '+counts.gestor+' · Area Manager: '+counts.area+' · Graduate: '+counts.graduate+' · Técnico: '+counts.tecnico+'</div><div style="margin-top:8px">Respuestas registradas: <b>'+s.responses.length+'</b> · Valoración media CONTROL: <b>'+avg+'/5</b></div>';
 }catch(e){box.textContent='No se pudieron cargar las estadísticas.';}
}
(async()=>{
 try{
  const p=await Data4Realtime.getPhase();draw(p);
  Data4Realtime.subscribePhase(draw);
  liveStatus.textContent=Data4Realtime.enabled?'Realtime conectado':'Modo demo local';
 }catch(e){console.error(e);draw('lobby');liveStatus.textContent='Error de conexión';}
})();
</script></body></html>
